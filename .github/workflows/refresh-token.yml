name: Refresh Token

on:
  # schedule:
  # Token refresh every 10 minutes (at 2, 12, 22, 32, 42, 52 minutes past the hour)
  # Offset to avoid conflict with load-credit at 7:05 AM UTC
  # DISABLED: Load credit workflow already refreshes tokens before loading
  # - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch: # Allow manual triggering (keep for testing)

# Prevent concurrent runs - only one token operation at a time
concurrency:
  group: token-operations
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  refresh-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create config from secrets
        run: |
          cat > config.json << EOF
          {
            "AccessToken": "${{ secrets.ACCESS_TOKEN }}",
            "RefreshToken": "${{ secrets.REFRESH_TOKEN }}",
            "Amount": "${{ secrets.AMOUNT }}",
            "MoneycardId": "${{ secrets.MONEYCARD_ID }}"
          }
          EOF

      - name: Run token refresh
        id: refresh
        run: node github-refresh-token.js
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          AMOUNT: ${{ secrets.AMOUNT }}
          MONEYCARD_ID: ${{ secrets.MONEYCARD_ID }}

      - name: Update GitHub secrets
        if: steps.refresh.outputs.tokens_updated == 'true'
        uses: actions/github-script@v7
        env:
          NEW_ACCESS_TOKEN: ${{ steps.refresh.outputs.access_token }}
          NEW_REFRESH_TOKEN: ${{ steps.refresh.outputs.refresh_token }}
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const sodium = require('libsodium-wrappers');
            await sodium.ready;

            // Get repository public key
            const { data: publicKey } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const publicKeyBytes = Buffer.from(publicKey.key, 'base64');

            // Tokens are read from the environment rather than interpolated into
            // this script, so a token containing a quote cannot corrupt it.
            const seal = (value) =>
              Buffer.from(sodium.crypto_box_seal(Buffer.from(value), publicKeyBytes)).toString('base64');

            const updates = {
              ACCESS_TOKEN: process.env.NEW_ACCESS_TOKEN,
              REFRESH_TOKEN: process.env.NEW_REFRESH_TOKEN,
            };

            for (const [name, value] of Object.entries(updates)) {
              if (!value) continue;
              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: name,
                encrypted_value: seal(value),
                key_id: publicKey.key_id,
              });
              console.log(`${name} updated`);
            }

            console.log('Secrets updated successfully');

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
