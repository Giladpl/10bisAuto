name: Keepalive

# Keeps scheduled workflows alive by making a periodic empty commit.
# GitHub disables scheduled (cron) workflows after 60 days without repo
# activity. This runs monthly so that never happens. No third-party
# actions are used, so there is nothing external that can break.

on:
  # Run at 06:00 UTC on the 1st of every month.
  schedule:
    - cron: "0 6 1 * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make an empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive ($(date -u +%Y-%m-%d)) [skip ci]"
          git push
