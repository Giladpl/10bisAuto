name: Load Credit

on:
  schedule:
    # 00:23 UTC, Sunday-Thursday (03:23 Israel in summer, 02:23 in winter).
    #
    # GitHub does not run scheduled workflows on time. It queues them and
    # deprioritises them when Actions is busy. At the old 07:05 UTC this job
    # ran ~45 minutes late through August 2026, then from 2026-08-27 settled
    # at a steady 4.5-8 hours late, which put the credit load at 15:00-18:00
    # Israel time - too late to notice it had happened.
    #
    # The delay cannot be removed, so the start time absorbs it. Measured
    # against the 17 delayed runs (min 271 min, median 327, max 475), 00:23 UTC
    # lands at roughly 08:00-09:00 Israel time, worst case 11:20 - and at 03:23
    # if GitHub ever catches up again. Every one of those is the same calendar
    # day in Israel, which is what keeps the Sunday-Thursday mapping honest.
    #
    # The minute is deliberately odd: runs scheduled on the hour wait longest.
    # The run summary reports the actual queue delay, so retune from real data
    # rather than guesswork.
    - cron: "23 0 * * 0,1,2,3,4"
  workflow_dispatch:
    inputs:
      force_weekend:
        description: "Load credit even if today is Friday/Saturday"
        type: boolean
        default: false

# Prevent concurrent runs - only one token operation at a time
concurrency:
  group: token-operations
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TZ: Asia/Jerusalem

jobs:
  load-credit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create config from secrets
        run: |
          cat > config.json << EOF
          {
            "AccessToken": "${{ secrets.ACCESS_TOKEN }}",
            "RefreshToken": "${{ secrets.REFRESH_TOKEN }}",
            "Amount": "${{ secrets.AMOUNT }}",
            "MoneycardId": "${{ secrets.MONEYCARD_ID }}"
          }
          EOF

      # A refresh failure must NOT abort the job. Access tokens are valid for
      # ~3 months, so a transient error here (the 10bis API returned 403 for
      # every retry on 2026-08-30) leaves the stored token perfectly usable.
      # Previously that aborted the job and the day's credit was never loaded.
      - name: Refresh tokens before credit loading
        id: refresh
        continue-on-error: true
        run: node github-refresh-token.js
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          AMOUNT: ${{ secrets.AMOUNT }}
          MONEYCARD_ID: ${{ secrets.MONEYCARD_ID }}

      - name: Warn if the token refresh did not succeed
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::warning::Token refresh failed - continuing with the existing stored tokens."

      - name: Update GitHub secrets with fresh tokens
        if: steps.refresh.outputs.tokens_updated == 'true'
        uses: actions/github-script@v7
        env:
          NEW_ACCESS_TOKEN: ${{ steps.refresh.outputs.access_token }}
          NEW_REFRESH_TOKEN: ${{ steps.refresh.outputs.refresh_token }}
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const sodium = require('libsodium-wrappers');
            await sodium.ready;

            // Get repository public key
            const { data: publicKey } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const publicKeyBytes = Buffer.from(publicKey.key, 'base64');

            // Tokens are read from the environment rather than interpolated into
            // this script, so a token containing a quote cannot corrupt it.
            const seal = (value) =>
              Buffer.from(sodium.crypto_box_seal(Buffer.from(value), publicKeyBytes)).toString('base64');

            const updates = {
              ACCESS_TOKEN: process.env.NEW_ACCESS_TOKEN,
              REFRESH_TOKEN: process.env.NEW_REFRESH_TOKEN,
            };

            for (const [name, value] of Object.entries(updates)) {
              if (!value) continue;
              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: name,
                encrypted_value: seal(value),
                key_id: publicKey.key_id,
              });
              console.log(`${name} updated`);
            }

            console.log('Secrets updated successfully');

      - name: Update config.json with fresh tokens
        run: |
          if [ "${{ steps.refresh.outputs.tokens_updated }}" == "true" ]; then
            cat > config.json << EOF
          {
            "AccessToken": "${{ steps.refresh.outputs.access_token }}",
            "RefreshToken": "${{ steps.refresh.outputs.refresh_token }}",
            "Amount": "${{ secrets.AMOUNT }}",
            "MoneycardId": "${{ secrets.MONEYCARD_ID }}"
          }
          EOF
            echo "✓ Config file updated with fresh tokens from refresh step"
          else
            echo "✓ Using existing config.json with original tokens (no refresh needed)"
          fi

      - name: Run credit loading with fresh tokens
        id: load-credit
        run: node github-load-credit.js
        env:
          ACCESS_TOKEN: ${{ steps.refresh.outputs.access_token || secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ steps.refresh.outputs.refresh_token || secrets.REFRESH_TOKEN }}
          AMOUNT: ${{ secrets.AMOUNT }}
          MONEYCARD_ID: ${{ secrets.MONEYCARD_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # The cron above already restricts scheduled runs to Sunday-Thursday,
          # so a scheduled run that lands on a Friday is simply a delayed
          # weekday run and must still load. Without this, a long enough delay
          # on a Thursday would silently skip the load and still report success.
          ENFORCE_WEEKEND_SKIP: ${{ (github.event_name == 'schedule' || inputs.force_weekend) && 'false' || 'true' }}

      - name: Verify credit was actually loaded
        if: always()
        run: |
          outcome="${{ steps.load-credit.outputs.credit_loaded }}"
          case "$outcome" in
            success)
              echo "✅ Credit loaded successfully."
              ;;
            skipped_weekend)
              echo "::warning::Credit loading was skipped - today is Friday/Saturday."
              ;;
            *)
              echo "::error::Credit was NOT loaded (outcome: '${outcome:-no outcome reported}')."
              exit 1
              ;;
          esac

      - name: Write run summary
        if: always()
        run: |
          outcome="${{ steps.load-credit.outputs.credit_loaded }}"
          {
            echo "### 10bis credit load"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Outcome | \`${outcome:-none}\` |"
            echo "| Token refresh | \`${{ steps.refresh.outcome }}\` |"
            echo "| Started (Israel) | $(TZ=Asia/Jerusalem date '+%a %Y-%m-%d %H:%M') |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            cron="${{ github.event.schedule }}"
            min=$(echo "$cron" | awk '{print $1}')
            hr=$(echo "$cron" | awk '{print $2}')
            scheduled=$(date -u -d "$(date -u +%Y-%m-%d) ${hr}:${min}:00" +%s)
            delay=$(( ($(date -u +%s) - scheduled) / 60 ))
            # A run delayed past midnight UTC compares against the wrong day.
            [ "$delay" -lt 0 ] && delay=$(( delay + 1440 ))
            echo "| Scheduled for | \`$cron\` UTC |" >> "$GITHUB_STEP_SUMMARY"
            echo "| GitHub queue delay | ${delay} min |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$delay" -gt 180 ]; then
              echo "::warning::This run started ${delay} minutes after its scheduled time."
            fi
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      # Without this the only sign of a failed day is a red mark in the Actions
      # tab. Opening an issue makes GitHub email the repository owner, so a
      # missed load is noticed even when no Teams webhook is configured.
      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jerusalem' });
            const title = `🔴 10bis credit load failed — ${today}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled credit load did not complete on **${today}**.`,
              '',
              `- Run: ${runUrl}`,
              `- Token refresh: \`${{ steps.refresh.outcome }}\``,
              `- Credit loading: \`${{ steps.load-credit.outputs.credit_loaded || 'no outcome reported' }}\``,
              '',
              'Check the run logs. If the tokens have expired, refresh them with `npm run update-github-secrets`.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation-failure',
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation-failure'],
              });
            }
